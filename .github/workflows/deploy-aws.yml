name: Deploy wolf-game to AWS
on:
  push:
    branches: [main]
    paths: ["frontend/**", "deploy/**", ".dockerignore", ".github/workflows/deploy-aws.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wolf-game-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Test authentication
        run: npm run test:auth
        working-directory: frontend
      - name: Test MySQL API in a disposable database
        run: npm run test:data
        working-directory: frontend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: unused
          DB_USER: root
          DB_PASSWORD: ci-test-root
          DB_ROOT_PASSWORD: ci-test-root
          AUTH_USERNAME: ci-owner
          AUTH_PASSWORD: ci-test-password
      - name: Build production website
        run: npm run build
        working-directory: frontend
      - name: Package release
        run: >-
          tar -czf "$RUNNER_TEMP/wolf-release.tar.gz"
          .dockerignore deploy/Dockerfile deploy/compose.aws.yml
          frontend/package.json frontend/package-lock.json
          frontend/server frontend/src/utils frontend/dist
      - name: Deploy release to AWS
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$AWS_HOST" && test -n "$AWS_USER" && test -n "$AWS_SSH_KEY" && test -n "$AWS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/wolf-ssh"
          printf '%s\n' "$AWS_SSH_KEY" > "$RUNNER_TEMP/wolf-ssh/key"
          printf '%s\n' "$AWS_KNOWN_HOSTS" > "$RUNNER_TEMP/wolf-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/wolf-ssh/key" "$RUNNER_TEMP/wolf-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/wolf-ssh/key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/wolf-ssh/known_hosts" "$AWS_USER@$AWS_HOST" "deploy $RELEASE_SHA" < "$RUNNER_TEMP/wolf-release.tar.gz"
      - name: Verify HTTPS website
        run: curl --fail --silent --retry 3 https://wolf.98.81.182.132.sslip.io/api/health
