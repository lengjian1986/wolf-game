server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wolf.98.81.182.132.sslip.io;
    ssl_certificate /etc/letsencrypt/live/wolf.98.81.182.132.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wolf.98.81.182.132.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WolfSSL:1m;
    client_max_body_size 1M;
    location / {
        proxy_pass http://127.0.0.1:20223;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
